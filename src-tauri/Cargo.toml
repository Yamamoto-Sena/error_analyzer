[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# プロジェクトフォルダ選択ダイアログのみに使用（フロントエンドからはJS版プラグインを介さず、
# 自作コマンド経由でのみ呼び出す。詳細はsrc/lib.rsのpick_project_rootを参照）。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# ターミナル監視モードで、Windowsのコンソールアプリ(cmd.exe等)が日本語ロケールで出力する
# Shift-JIS(CP932)のエラーメッセージ等をUTF-8として読み取れない問題への対処に使用。
# 詳細はsrc/terminal_watch.rsのspawn_reader_threadを参照。
encoding_rs = "0.8"
# クリップボード監視モードで、OSクリップボードのテキストを読み取るために使用。
# フロントエンド(JS)からは一切呼び出さず、Rust側の`ClipboardExt`拡張トレイト経由で
# clipboard_watch.rsの内部からのみ呼び出す（詳細はclipboard_watch.rsを参照）。
tauri-plugin-clipboard-manager = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
